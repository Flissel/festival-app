<?xml version="1.0" encoding="UTF-8"?>
<!--
  Generative "Mathe-Kunst": fraktales Perlin-Rauschen (feTurbulence), beschnitten
  auf einen 30°-Keil und 12-fach abwechselnd gespiegelt rotiert. Erst das
  Spiegeln jeder zweiten Kopie erzeugt die Achsensymmetrie eines echten
  Kaleidoskops — bloße Rotation ergäbe nur ein Windrad.

  Keil-Geometrie (Mittelpunkt 200/200, Radius 320, halber Öffnungswinkel 15°):
    x    = 200 + 320·cos15° = 509.10
    y    = 200 ∓ 320·sin15° = 117.18 / 282.82

  Bewusst als Datei und nicht als Komponente: So rastert der Browser das Muster
  genau einmal und kann es für beliebig viele Scheiben wiederverwenden.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="k-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="tinted"
        values="1.6 -0.4  0.5 0 -0.15
                0.2  1.1 -0.5 0 -0.10
                0.9 -0.2  1.7 0 -0.20
                0    0    0   0  1"/>
      <feComponentTransfer in="tinted">
        <feFuncR type="gamma" exponent="1.8"/>
        <feFuncG type="gamma" exponent="2.2"/>
        <feFuncB type="gamma" exponent="1.5"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="k-wedge">
      <path d="M 200 200 L 509.10 117.18 A 320 320 0 0 1 509.10 282.82 Z"/>
    </clipPath>

    <radialGradient id="k-fade">
      <stop offset="30%" stop-color="white" stop-opacity="1"/>
      <stop offset="72%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="k-mask">
      <rect width="400" height="400" fill="url(#k-fade)"/>
    </mask>

    <!-- Rauschfläche deckt genau die Bounding-Box des Keils ab -->
    <g id="k-slice" clip-path="url(#k-wedge)">
      <rect x="195" y="110" width="330" height="180" filter="url(#k-noise)"/>
    </g>
  </defs>

  <g mask="url(#k-mask)">
    <use href="#k-slice" transform="rotate(0 200 200)"/>
    <use href="#k-slice" transform="rotate(30 200 200) scale(1 -1) translate(0 -400)"/>
    <use href="#k-slice" transform="rotate(60 200 200)"/>
    <use href="#k-slice" transform="rotate(90 200 200) scale(1 -1) translate(0 -400)"/>
    <use href="#k-slice" transform="rotate(120 200 200)"/>
    <use href="#k-slice" transform="rotate(150 200 200) scale(1 -1) translate(0 -400)"/>
    <use href="#k-slice" transform="rotate(180 200 200)"/>
    <use href="#k-slice" transform="rotate(210 200 200) scale(1 -1) translate(0 -400)"/>
    <use href="#k-slice" transform="rotate(240 200 200)"/>
    <use href="#k-slice" transform="rotate(270 200 200) scale(1 -1) translate(0 -400)"/>
    <use href="#k-slice" transform="rotate(300 200 200)"/>
    <use href="#k-slice" transform="rotate(330 200 200) scale(1 -1) translate(0 -400)"/>
  </g>
</svg>
